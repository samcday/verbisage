[package]
name = "verbisage"
version = "0.1.0"
edition = "2024"
description = "Multi-purpose word-list and word-frequency library with spell-check, swipe-typing queries, and next-word prediction"
repository = "https://github.com/verbisage/verbisage"
keywords = ["dictionary", "spellcheck", "text-prediction", "swipe-typing", "nlp"]
categories = ["text-processing", "natural-language"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
features = ["sqlite", "hunspell"]

[features]
default = ["sqlite", "hunspell"]
sqlite = ["dep:rusqlite"]
hunspell = ["dep:zspell"]
marisa = ["dep:rsmarisa"]
dbus = ["dep:zbus", "dep:tokio"]
patricia = ["dep:patricia_dict"]

[dependencies]
patricia_dict = { path = "patricia_dict", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }

rusqlite = { version = "0.32", features = ["bundled"], optional = true }
zspell = { version = "0.5", features = ["unstable-suggestions"], optional = true }
rsmarisa = { version = "0.4", optional = true }
zbus = { version = "5", features = ["p2p"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "verbisaged"
path = "src/bin/verbisaged.rs"

[[bin]]
name = "verbisage"
path = "src/bin/verbisage.rs"

[[bin]]
name = "verbisage-introspect"
path = "src/bin/verbisage-introspect.rs"
required-features = ["dbus"]
